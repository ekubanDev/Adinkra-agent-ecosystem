# Overseer Hermes profile. Secrets come from the environment (see docker-compose.yml), never from here.
model:
  provider: custom
  default: gpt-5.5          # keep in step with LLM_MODEL in .env; swap freely, it's any OpenAI-compatible endpoint
  base_url: https://api.openai.com/v1   # overridden by OPENAI_BASE_URL from LLM_BASE_URL
agent:
  max_turns: 60
  api_max_retries: 3
  reasoning_effort: medium
# No shell, file or web tools: the Overseer reaches the outside world only through the MCP tools below.
toolsets: [todo, cronjob, skills]
platform_toolsets:
  cli: [todo, cronjob, skills]
  telegram: [todo, cronjob, skills]
mcp_servers:
  adinkra_control:
    command: /opt/hermes/.venv/bin/python
    args: [/opt/data/mcp/adinkra_control.py]
    env:
      CONTROL_URL: http://control:8000
