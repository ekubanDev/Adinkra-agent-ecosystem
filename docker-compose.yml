services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  control:
    build: ./control
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/adinkra
    depends_on:
      - mongo
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  mongo_data:
