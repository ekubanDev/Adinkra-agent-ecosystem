services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  control:
    build: ./control
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/adinkra
    depends_on:
      - mongo
    ports:
      - "127.0.0.1:8000:8000"

  overseer:
    image: nousresearch/hermes-agent
    command: gateway run
    restart: unless-stopped
    volumes:
      - ./overseer/data:/opt/data
      - ./overseer/config.yaml:/opt/data/config.yaml:ro
      - ./overseer/SOUL.md:/opt/data/SOUL.md:ro
      - ./overseer/skills/control-service:/opt/data/skills/control-service:ro
      - ./overseer/skills/review-drafts:/opt/data/skills/review-drafts:ro
    environment:
      OPENAI_BASE_URL: ${LLM_BASE_URL}
      OPENAI_API_KEY: ${LLM_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_CHAT_ID}
      TELEGRAM_HOME_CHANNEL: ${TELEGRAM_CHAT_ID}
    depends_on:
      - control

volumes:
  mongo_data:
